name: iOS Build (unsigned)

# 在 GitHub 託管的 macOS runner 上實際編譯 iOS app 並在模擬器啟動截圖。
# 產出未簽署的模擬器版（CODE_SIGNING_ALLOWED=NO），故不需 Apple 開發者憑證。
# 公開 repo 使用 GitHub 託管 runner（含 macOS）免費、無額度上限。

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS 編譯 + 模擬器截圖（未簽署）
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.drinkmorewater.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 顯示建置環境
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== Node / npm ==="; node -v && npm -v

      - name: 安裝相依
        working-directory: mobile
        run: npm install

      - name: 核心邏輯單元測試
        working-directory: mobile
        run: node --experimental-strip-types --test "src/core/__tests__/*.test.ts"

      - name: Prebuild（產生 ios/ 原生專案並安裝 Pods）
        working-directory: mobile
        run: npx expo prebuild --platform ios

      - name: Xcode 編譯（未簽署，Release，iOS Simulator）
        working-directory: mobile/ios
        # 截圖模式：JS bundle 內嵌時讀到此旗標 → App 跳過通知權限請求，
        # 自動截圖才拍得到實際 UI（不影響 package-ipa 產出的正式 app）。
        env:
          EXPO_PUBLIC_SCREENSHOT: "1"
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Workspace=$WORKSPACE  Scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 開模擬器、啟動 App、截圖
        id: shot
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          OUT="$GITHUB_WORKSPACE/screenshots"

          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"

          # 挑一台可用的 iPhone 模擬器並開機
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' in rt:
                  for x in devs:
                      if x.get('isAvailable') and 'iPhone' in x['name']:
                          print(x['udid']); sys.exit()
          ")
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          # 截圖模式跳過權限框，等 RN 載入後直接是 Home 主畫面（含水杯 + 統計 + 週圖）
          sleep 12
          xcrun simctl io "$UDID" screenshot "$OUT/01-home.png" || true

          # 安裝 idb，用來點底部「設定」分頁，截設定頁
          brew install idb-companion || true
          pipx install fb-idb 2>/dev/null || python3 -m pip install --user --break-system-packages fb-idb || true
          export PATH="$HOME/.local/bin:$PATH"
          idb list-targets || true
          if command -v idb >/dev/null 2>&1; then
            idb ui describe-all --udid "$UDID" --json > ui.json 2>/dev/null || true
            COORD=$(python3 -c "
          import json
          try:
              els=json.load(open('ui.json'))
          except Exception:
              els=[]
          for e in els:
              if (e.get('AXLabel') or '') in ('設定','设置','Settings'):
                  f=e['frame']; print(int(f['x']+f['width']/2), int(f['y']+f['height']/2)); break
          ")
            echo "Settings tab coord: $COORD"
            if [ -n "$COORD" ]; then idb ui tap --udid "$UDID" $COORD || true; sleep 3; fi
          fi
          xcrun simctl io "$UDID" screenshot "$OUT/02-settings.png" || true

          ls -la "$OUT"

      - name: 上傳模擬器截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          if-no-files-found: warn

  package-ipa:
    name: 打包未簽署 .ipa（供 Sideloadly / SideStore 重簽）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝相依
        working-directory: mobile
        run: npm install

      - name: Prebuild（產生 ios/ 原生專案並安裝 Pods）
        working-directory: mobile
        run: npx expo prebuild --platform ios

      - name: Xcode 編譯（未簽署，Release，iOS 實機 arm64）
        working-directory: mobile/ios
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Workspace=$WORKSPACE  Scheme=$SCHEME"
          # 為實機 (iphoneos) 編譯但完全不簽署；簽署交給 Sideloadly / SideStore 用使用者的 Apple ID 完成
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa（Payload/）
        working-directory: mobile/ios
        run: |
          set -eo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          ( cd payload && zip -qr "$GITHUB_WORKSPACE/drinkwater-unsigned.ipa" Payload )
          ls -lh "$GITHUB_WORKSPACE/drinkwater-unsigned.ipa"

      - name: 上傳未簽署 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: drinkwater-unsigned.ipa
          if-no-files-found: error
