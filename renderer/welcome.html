<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      user-select: none;
      background: linear-gradient(145deg, #0d2b3e 0%, #0a1f2e 50%, #071a26 100%);
      color: rgba(255, 255, 255, 0.92);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #4dd0e1, #00bcd4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(20, 60, 80, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(77, 208, 225, 0.15);
    }

    .step-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(77, 208, 225, 0.12);
      border: 1px solid rgba(77, 208, 225, 0.25);
    }

    .step-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #4dd0e1;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .step-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .step-text strong {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
    }

    .step-text span {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.65);
    }

    .footer {
      display: flex;
      justify-content: center;
      padding-top: 4px;
    }

    .btn {
      padding: 12px 40px;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #00bcd4, #0097a7);
      box-shadow: 0 4px 16px rgba(0, 188, 212, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 188, 212, 0.45);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 188, 212, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 id="w-title">歡迎使用喝水提醒！</h1>
      <p id="w-subtitle">幾個小提示，幫助你快速上手：</p>
    </div>

    <div class="steps">
      <!-- Step 1: 記錄喝水 -->
      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C12 2 5 9 5 14a7 7 0 0 0 14 0c0-5-7-12-7-12z"/></svg>
        </div>
        <div class="step-text">
          <strong id="s1-title">記錄喝水</strong>
          <span id="s1-desc">水杯彈出時，長按杯子或按 Space 即可記錄一次飲水。</span>
        </div>
      </div>

      <!-- Step 2: 背景常駐 -->
      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
        <div class="step-text">
          <strong id="s2-title">背景常駐</strong>
          <span id="s2-desc">你可以隨時關閉這個視窗，提醒會在背景持續運作。</span>
        </div>
      </div>

      <!-- Step 3: 重新開啟 -->
      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <div class="step-text">
          <strong id="s3-title">重新開啟</strong>
          <span id="s3-desc">點擊右下角工具列的水滴圖示，即可隨時開啟統計與設定。</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="btn" id="w-btn">開始使用</button>
    </div>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
