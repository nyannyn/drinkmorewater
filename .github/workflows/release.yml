name: Build & Release

on:
  push:
    tags: ["v*"]
  # 手動觸發＝只跑 build-mac 的簽署／公證乾跑（不建 Release、不上傳到 GitHub Release），
  # 用來在打 tag 前驗證 Apple 憑證與 secrets 設定正確。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Include *.exe,*.yml -Recurse
          $checksums = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            "$hash  $($f.Name)"
          }
          $checksums | Out-File -FilePath dist/SHA256SUMS-win.txt -Encoding utf8
          Write-Host "=== SHA256 Checksums (Windows) ==="
          Get-Content dist/SHA256SUMS-win.txt

      - name: Upload to VirusTotal & get links
        shell: pwsh
        if: env.VT_API_KEY != ''
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $exeFiles = Get-ChildItem dist -Filter *.exe
          $vtLinks = @()
          foreach ($f in $exeFiles) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $link = "https://www.virustotal.com/gui/file/$hash"
            Write-Host "Uploading $($f.Name) to VirusTotal..."
            try {
              if ($f.Length -gt 32MB) {
                Write-Host "  File is large ($([math]::Round($f.Length/1MB, 1)) MB), using large file endpoint..."
                $uploadUrlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" `
                  -Method Get `
                  -Headers @{ "x-apikey" = $env:VT_API_KEY }
                $uploadUrl = $uploadUrlResp.data
              } else {
                $uploadUrl = "https://www.virustotal.com/api/v3/files"
              }
              Invoke-RestMethod -Uri $uploadUrl `
                -Method Post `
                -Headers @{ "x-apikey" = $env:VT_API_KEY } `
                -Form @{ file = Get-Item $f.FullName }
              Write-Host "  Upload OK -> $link"
            } catch {
              Write-Host "  Upload failed: $($_.Exception.Message)"
              Write-Host "  Providing hash link only -> $link"
            }
            $vtLinks += "- [$($f.Name)]($link)"
          }
          $vtLinks -join "`n" | Out-File -FilePath dist/VT_LINKS.md -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-win
          path: |
            dist/*.exe
            dist/latest.yml
            dist/SHA256SUMS-win.txt
            dist/VT_LINKS.md

  build-linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.AppImage *.deb latest-linux.yml > SHA256SUMS-linux.txt
          echo "=== SHA256 Checksums (Linux) ==="
          cat SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
            dist/SHA256SUMS-linux.txt

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      # 缺任一 secret 時 electron-builder 只會「警告後略過」簽署／公證，照樣綠燈——
      # 這裡先擋下，避免打 tag 後靜默出貨未簽名版。
      - name: 檢查 Apple 簽署 secrets 已設定
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 repo secrets：${missing[*]}（設定方式見 docs/APPLE_SIGNING_READY.md）"
            exit 1
          fi
          if grep -q REPLACE_WITH_APPLE_TEAM_ID package.json; then
            echo "::error::package.json build.mac.notarize.teamId 仍是 placeholder，請填入 Apple Team ID"
            exit 1
          fi

      - run: npm run dist:mac -- --publish ${{ github.event_name == 'workflow_dispatch' && 'never' || 'onTag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application 憑證（.p12 base64）與密碼；electron-builder 據此簽署
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # notarytool 登入用 Apple ID＋App 專用密碼；Team ID 寫在 package.json build.mac.notarize.teamId
          # （electron-builder 24.x 不讀 APPLE_TEAM_ID 環境變數）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      # 正向證據：每個 .app 都要是 Developer ID 簽章、已釘上公證票（stapler）、Gatekeeper 放行
      - name: 驗證簽署與公證
        run: |
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          # x64 出在 dist/mac/、arm64 出在 dist/mac-arm64/；少一個＝有一種架構沒驗到
          if [ ${#apps[@]} -ne 2 ]; then
            echo "::error::預期 dist/mac*/ 底下有 2 個 .app（x64 + arm64），實際 ${#apps[@]}：${apps[*]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "=== $app ==="
            codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
            grep -q 'Authority=Developer ID Application' /tmp/codesign.txt
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app" 2>&1 | tee /tmp/spctl.txt
            grep -q 'source=Notarized Developer ID' /tmp/spctl.txt
          done

      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip latest-mac.yml > SHA256SUMS-mac.txt
          echo "=== SHA256 Checksums (macOS) ==="
          cat SHA256SUMS-mac.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/SHA256SUMS-mac.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-win, build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release body
        run: |
          # Detect actual filenames (handle spaces in names)
          get_name() { local f; f=$(ls $1 2>/dev/null | head -1); [ -n "$f" ] && basename "$f" || echo ""; }
          NSIS=$(get_name "dist/*Setup*.exe")
          PORTABLE=$(get_name "dist/*portable*.exe")
          [ -z "$PORTABLE" ] && PORTABLE=$(get_name "dist/*Portable*.exe")
          APPIMAGE=$(get_name "dist/*.AppImage")
          DEB=$(get_name "dist/*.deb")
          DMG_X64=$(get_name "dist/*-x64.dmg")
          DMG_ARM=$(get_name "dist/*-arm64.dmg")
          ZIP_X64=$(get_name "dist/*-x64.zip")
          ZIP_ARM=$(get_name "dist/*-arm64.zip")
          TAG="${GITHUB_REF#refs/tags/}"

          # URL-encode filenames for download links (handles Chinese characters & spaces)
          urlencode() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$1"; }

          {
            echo "## ⬇️ 下載安裝"
            echo ""
            echo "| 系統 | 下載連結 | 說明 |"
            echo "|------|----------|------|"
            if [ -n "$NSIS" ]; then
              echo "| 🪟 **Windows** | [${NSIS}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$NSIS")) | 安裝版（建議）|"
            fi
            if [ -n "$PORTABLE" ]; then
              echo "| 🪟 Windows | [${PORTABLE}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$PORTABLE")) | 免安裝版 |"
            fi
            if [ -n "$DMG_ARM" ]; then
              echo "| 🍎 **macOS (Apple Silicon)** | [${DMG_ARM}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$DMG_ARM")) | M1/M2/M3/M4 |"
            fi
            if [ -n "$DMG_X64" ]; then
              echo "| 🍎 macOS (Intel) | [${DMG_X64}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$DMG_X64")) | Intel Mac |"
            fi
            if [ -n "$APPIMAGE" ]; then
              echo "| 🐧 **Linux** | [${APPIMAGE}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$APPIMAGE")) | 通用（建議）|"
            fi
            if [ -n "$DEB" ]; then
              echo "| 🐧 Linux | [${DEB}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(urlencode "$DEB")) | Debian/Ubuntu |"
            fi
            echo ""
            echo "> macOS 版已由 Apple Developer ID 簽署並完成公證（notarized），開啟 DMG 後將 App 拖入「應用程式」即可，無需任何額外設定。"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>🔒 SHA256 校驗碼</summary>"
            echo ""
            echo '```'
            cat dist/SHA256SUMS-win.txt 2>/dev/null || true
            cat dist/SHA256SUMS-linux.txt 2>/dev/null || true
            cat dist/SHA256SUMS-mac.txt 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>🛡️ VirusTotal 掃描</summary>"
            echo ""
            if [ -f dist/VT_LINKS.md ]; then
              cat dist/VT_LINKS.md
            else
              echo "_VirusTotal scan skipped (no API key configured)_"
            fi
            echo "</details>"
          } > dist/RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest.yml
            dist/latest-linux.yml
            dist/latest-mac.yml
            dist/SHA256SUMS-win.txt
            dist/SHA256SUMS-linux.txt
            dist/SHA256SUMS-mac.txt
