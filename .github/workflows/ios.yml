name: iOS Build (unsigned)

# 在 GitHub 託管的 macOS runner 上實際編譯 iOS app 並在模擬器啟動截圖。
# 產出未簽署的模擬器版（CODE_SIGNING_ALLOWED=NO），故不需 Apple 開發者憑證。
# 公開 repo 使用 GitHub 託管 runner（含 macOS）免費、無額度上限。

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS 編譯 + 模擬器截圖（未簽署）
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.drinkmorewater.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 顯示建置環境
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== Node / npm ==="; node -v && npm -v

      - name: 安裝相依
        working-directory: mobile
        run: npm install

      - name: 核心邏輯單元測試
        working-directory: mobile
        run: node --experimental-strip-types --test "src/core/__tests__/*.test.ts"

      - name: Prebuild（產生 ios/ 原生專案並安裝 Pods）
        working-directory: mobile
        run: npx expo prebuild --platform ios

      - name: Xcode 編譯（未簽署，Release，iOS Simulator）
        working-directory: mobile/ios
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Workspace=$WORKSPACE  Scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 開模擬器、啟動 App、截圖
        id: shot
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          OUT="$GITHUB_WORKSPACE/screenshots"

          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"

          # 挑一台可用的 iPhone 模擬器並開機
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' in rt:
                  for x in devs:
                      if x.get('isAvailable') and 'iPhone' in x['name']:
                          print(x['udid']); sys.exit()
          ")
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          sleep 8
          # 第一張：啟動畫面 / 權限詢問
          xcrun simctl io "$UDID" screenshot "$OUT/01-launch.png" || true

          # 用 idb 自動點掉通知權限對話框的「Allow / 允許」
          brew install idb-companion || true
          pip3 install --quiet fb-idb || pip3 install --quiet --break-system-packages fb-idb || true
          if command -v idb >/dev/null 2>&1; then
            idb ui describe-all --udid "$UDID" --json > ui.json 2>/dev/null || true
            COORD=$(python3 -c "
          import json
          try:
              els=json.load(open('ui.json'))
          except Exception:
              els=[]
          for e in els:
              lbl=(e.get('AXLabel') or '')
              if lbl in ('Allow','允許','允许','許可'):
                  f=e['frame']; print(int(f['x']+f['width']/2), int(f['y']+f['height']/2)); break
          ")
            echo "Allow button coord: $COORD"
            if [ -n "$COORD" ]; then idb ui tap --udid "$UDID" $COORD || true; fi
          fi
          sleep 6
          # 第二張：應為 Home 主畫面
          xcrun simctl io "$UDID" screenshot "$OUT/02-home.png" || true

          # 切到設定分頁再截一張（點底部右側 tab，約螢幕下緣 3/4 寬處）
          if command -v idb >/dev/null 2>&1; then
            SIZE=$(xcrun simctl io "$UDID" enumerate 2>/dev/null | head -1 || true)
            idb ui describe-all --udid "$UDID" --json > ui2.json 2>/dev/null || true
            COORD2=$(python3 -c "
          import json
          try:
              els=json.load(open('ui2.json'))
          except Exception:
              els=[]
          for e in els:
              if (e.get('AXLabel') or '') in ('設定','设置','Settings','設定 ','設置'):
                  f=e['frame']; print(int(f['x']+f['width']/2), int(f['y']+f['height']/2)); break
          ")
            echo "Settings tab coord: $COORD2"
            if [ -n "$COORD2" ]; then idb ui tap --udid "$UDID" $COORD2 || true; sleep 3; fi
          fi
          xcrun simctl io "$UDID" screenshot "$OUT/03-settings.png" || true

          ls -la "$OUT"

      - name: 上傳模擬器截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          if-no-files-found: warn
